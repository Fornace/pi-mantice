name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Record publishing toolchain
        run: |
          node --version
          npm --version
      - name: Verify release source before validation
        run: node .github/scripts/check-release.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:session-wire
      - name: Install rtk
        run: |
          curl -sSL https://github.com/rtk-ai/rtk/releases/latest/download/rtk-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /usr/local/bin rtk
          rtk --version
      - run: npm run test:fast-wire
      - run: npm run verify:package
      - name: Recheck source immediately before publishing
        run: node .github/scripts/check-release.mjs
      - run: npm publish --provenance --access public
